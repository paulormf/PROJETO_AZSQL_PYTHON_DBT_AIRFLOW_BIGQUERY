version: 2

models:
  - name: stg_orders
    description: Thin staging view over Bronze orders; business transformations belong downstream.
    columns:
      - name: order_id
        description: Primary key from Azure SQL.
        data_tests:
          - not_null
          - unique

  - name: stg_order_items
    description: Thin staging view over Bronze order items.
    columns:
      - name: order_item_id
        description: Primary key from Azure SQL.
        data_tests:
          - not_null
          - unique

      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
                
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

  - name: stg_products
    description: Thin staging view over Bronze products.
    columns:
      - name: product_id
        description: Primary key from Azure SQL.
        data_tests:
          - not_null
          - unique

  - name: stg_categories
    description: Thin staging view over Bronze categories.
    columns:
      - name: category_id
        description: Primary key from Azure SQL.
        data_tests:
          - not_null
          - unique

  - name: stg_customers
    description: Staging view over Bronze customers. CPF, CNPJ and phone expose only their last four digits; email is partially masked. Full name and birth date remain identifiable and require a defined purpose and restricted access.
    columns:
      - name: customer_id
        description: Primary key from Azure SQL.
        data_tests:
          - not_null
          - unique

      - name: cpf
        description: CPF with only its last four digits visible; source value remains restricted in Bronze.

      - name: cnpj
        description: CNPJ with only its last four digits visible; source value remains restricted in Bronze.

      - name: email
        description: Partially masked value preserving the first two local-part characters, first domain character, and suffix from the final dot; source email remains restricted in Bronze.

      - name: phone
        description: Phone with only its last four digits visible; source value remains restricted in Bronze.
