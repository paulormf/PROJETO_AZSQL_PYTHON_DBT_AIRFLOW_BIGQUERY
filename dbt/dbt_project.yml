model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  projeto_azsql_python_dbt_airflow_bigquery:
    staging:
      +schema: SILVER
      +materialized: view
      +tags: ["silver", "staging"]
    intermediate:
      +schema: SILVER
      +materialized: view
      +tags: ["silver", "intermediate"]
    marts:
      +schema: GOLD
      +materialized: table
      +tags: ["gold", "marts"]
