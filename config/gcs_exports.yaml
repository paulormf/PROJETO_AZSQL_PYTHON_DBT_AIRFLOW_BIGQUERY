# Control the export allowlist here. Disabled tables are skipped.
exports:
  - name: order_items
    enabled: true
    schema: dbo
    table: order_items
    load_mode: full
    # This portfolio currently exports all source columns. Revisit data minimization
    # before using the same pattern with personal or production data.
    columns: "*"
    chunk_rows: 5000

  - name: orders
    enabled: true
    schema: dbo
    table: orders
    load_mode: full
    columns: "*"
    chunk_rows: 5000

  - name: products
    enabled: true
    schema: dbo
    table: products
    load_mode: full
    columns: "*"
    chunk_rows: 5000

  - name: customers
    enabled: true
    schema: dbo
    table: customers
    load_mode: full
    columns: "*"
    chunk_rows: 5000

  - name: categories
    enabled: true
    schema: dbo
    table: categories
    load_mode: full
    columns: "*"
    chunk_rows: 5000

  - name: customer_addresses
    enabled: true
    schema: dbo
    table: customer_addresses
    load_mode: full
    columns: "*"
    chunk_rows: 5000

  - name: customer_contacts
    enabled: true
    schema: dbo
    table: customer_contacts
    load_mode: full
    columns: "*"
    chunk_rows: 5000
  
  - name: employees
    enabled: true
    schema: dbo
    table: employees
    load_mode: full
    columns: "*"
    chunk_rows: 5000

