# Controle aqui a lista de tabelas permitidas para exportação. Tabelas desabilitadas são ignoradas.
exports:
  - name: order_items
    enabled: true
    schema: dbo
    table: order_items
    load_mode: full
    incremental_strategy: cdc
    primary_key:
      - order_item_id
    # Este portfólio exporta atualmente todas as colunas da origem. Reavalie a minimização de dados
    # antes de usar o mesmo padrão com dados pessoais ou de produção.
    columns: "*"
    chunk_rows: 5000

  - name: orders
    enabled: true
    schema: dbo
    table: orders
    load_mode: full
    incremental_strategy: cdc
    primary_key:
      - order_id
    columns: "*"
    chunk_rows: 5000

  - name: products
    enabled: true
    schema: dbo
    table: products
    load_mode: full
    incremental_strategy: cdc
    primary_key:
      - product_id
    columns: "*"
    chunk_rows: 5000

  - name: customers
    enabled: true
    schema: dbo
    table: customers
    load_mode: full
    incremental_strategy: full_refresh
    columns: "*"
    chunk_rows: 5000

  - name: categories
    enabled: true
    schema: dbo
    table: categories
    load_mode: full
    incremental_strategy: full_refresh
    columns: "*"
    chunk_rows: 5000

  - name: customer_addresses
    enabled: true
    schema: dbo
    table: customer_addresses
    load_mode: full
    incremental_strategy: full_refresh
    columns: "*"
    chunk_rows: 5000

  - name: customer_contacts
    enabled: true
    schema: dbo
    table: customer_contacts
    load_mode: full
    incremental_strategy: full_refresh
    columns: "*"
    chunk_rows: 5000
  
  - name: employees
    enabled: true
    schema: dbo
    table: employees
    load_mode: full
    incremental_strategy: full_refresh
    columns: "*"
    chunk_rows: 5000

